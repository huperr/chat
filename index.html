<h1>hpcmehno's chatapp</h1>
<title>hpcmehno's chatapp</title>
<div style="margin: 5px; padding: 5px; outline: 1px solid black">
	<input type="text" id="txt" placeholder="text">
	<input id="name" placeholder="name">
	<button id="btn">submit</button>
	<button onclick="refresh()">refresh</button>
</div>
<div id="container" style="margin: 5px; padding: 5px; outline: 1px solid black; white-space: pre-line; max-height: 500px; overflow-y: auto"></div>
<p>thanks for using!</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const a = document.getElementById("txt")
const b = document.getElementById("name")
const btn = document.getElementById("btn")
const container = document.getElementById("container")
const {createClient} = supabase
const database = createClient('https://ycisphzvuxhxorwrvuam.supabase.co', 'sb_publishable_x-6_JGztxNF_8A1L9wJNig_00SAxm7d')

btn.addEventListener("click", async () => {
	const msg = "[" + b.value.trim() + "] " + a.value.trim()
	if (!msg) return
	const {error} = await database.from("chatter").insert({
		txt: msg
	})
	if (error) {
		console.log("smth went wrong")
	}
	else {
		console.log("yay!")
	}
	refresh()
})
async function refresh() {
	const {data, error} = await database.from("chatter").select("txt, time").order("time", {ascending: true})
	if (error) {
		console.log(error)
	}
	else {
		container.replaceChildren()
		data.forEach((thing) => {
			const date = new Date(thing.time).toLocaleString()
			const msg = document.createElement("p")
			msg.textContent = thing.txt + " (" + date + ")"
			container.appendChild(msg)
		})
		container.scrollTop = container.scrollHeight
	}
}
refresh()

</script>
